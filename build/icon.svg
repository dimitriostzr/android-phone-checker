<!-- Source artwork for build/icon.png. electron-builder converts the PNG to
     .icns / .ico at build time, so this file is the thing to edit; re-render it
     with scripts/render-icon.js after any change.

     One mark, used here and in the sidebar: a white phone whose body tapers into
     a shield, with a check inside it, on a dark grey ground. Fusing the two into a single silhouette is
     what makes it survive to 16 px — the old artwork floated a separate shield
     badge over a phone outline, and at dock size the two shapes and the badge's
     drop shadow collapsed into a smudge. The geometry below is written in the
     same 24-unit box the sidebar logo uses and scaled up, so the two cannot
     drift apart; test/icon.test.js holds them to it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45454d"/>
      <stop offset="1" stop-color="#26262b"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#sheen)"/>

  <!-- The mark, in 24-unit coordinates, scaled and centred on the tile. -->
  <g transform="translate(176 179) scale(28)"
     fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 2h6a3 3 0 0 1 3 3v8.3c0 3.9-2.4 6.9-6 8.7-3.6-1.8-6-4.8-6-8.7V5a3 3 0 0 1 3-3z"/>
    <path d="M10.4 5.2h3.2"/>
    <path d="M9.3 11.7l1.9 1.9 3.6-4.2"/>
  </g>
</svg>
